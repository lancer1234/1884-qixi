name: Add multi-select hint

on:
  push:
    paths:
      - '.github/workflows/add-multiselect-hint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update symptom heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="split-title"><div class="cn">目前症狀</div><div class="en">CURRENT SYMPTOMS</div></div>'
          new = '<div class="split-title"><div class="cn">目前症狀 <span style="font-family:\'Noto Sans TC\',\'PingFang TC\',sans-serif;font-size:12px;color:var(--gold);letter-spacing:.04em;margin-left:6px">可複選</span></div><div class="en">CURRENT SYMPTOMS</div></div>'
          if old not in s:
              raise SystemExit('Target heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show multi-select hint beside symptoms"
          git push
