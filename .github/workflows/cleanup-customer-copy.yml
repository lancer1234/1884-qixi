name: Cleanup customer-facing copy

on:
  push:
    paths:
      - '.github/workflows/cleanup-customer-copy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean internal-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            '<div class="note">現場可同步保留簡單的實體投稿箱、紙條與筆，讓客人自由選擇參與方式。</div>': '',
            '<div id="exSuccess" class="card result" style="display:none"><div class="eyebrow">已留在這裡 · MESSAGE LEFT</div><div class="diagnosis">有些話，說完就夠了。</div><div class="diagnosis-en">SOME WORDS ARE ENOUGH ONCE SAID.</div></div>': '<div id="exSuccess" class="card result" style="display:none"><div class="eyebrow">已留在這裡 · MESSAGE LEFT</div><div class="diagnosis">收到了。今晚就留在這裡。</div><div class="diagnosis-en">DON\'T SEND IT. LEAVE IT HERE.</div></div>',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              s = s.replace(old, new)

          # Guard against internal execution notes accidentally exposed in customer HTML.
          forbidden = [
              '現場可同步保留簡單的實體投稿箱',
              '讓客人自由選擇參與方式',
              '正式活動可視需要設定',
              '系統備援',
          ]
          for text in forbidden:
              if text in s:
                  raise SystemExit(f'Internal copy still present: {text}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean internal copy from customer Web App"
          git push
