name: Fix Story six symptoms

on:
  push:
    paths:
      - '.github/workflows/fix-six-symptoms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Story symptom rendering in source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''ctx.fillStyle="#efe8df";ctx.font='28px "Noto Sans TC","Microsoft JhengHei",sans-serif';if(sis.length){sis.slice(0,4).forEach(s=>{ctx.fillText("✓  "+s[0],540,y);y+=48})}else{ctx.fillText("目前無明顯症狀",540,y);y+=48}'''

          new = '''ctx.fillStyle="#efe8df";if(sis.length){const symptomCount=Math.min(sis.length,6);const symptomFont=symptomCount>=5?24:28;const symptomGap=symptomCount>=5?39:48;ctx.font=symptomFont+'px "Noto Sans TC","Microsoft JhengHei",sans-serif';sis.slice(0,6).forEach(s=>{ctx.fillText("✓  "+s[0],540,y);y+=symptomGap})}else{ctx.font='28px "Noto Sans TC","Microsoft JhengHei",sans-serif';ctx.fillText("目前無明顯症狀",540,y);y+=48}'''

          if old not in s:
              # Fallback for small formatting differences.
              s, n = re.subn(
                  r'''ctx\.fillStyle="#efe8df";ctx\.font='28px "Noto Sans TC","Microsoft JhengHei",sans-serif';if\(sis\.length\)\{sis\.slice\(0,4\)\.forEach\(s=>\{ctx\.fillText\("✓  "\+s\[0\],540,y\);y\+=48\}\)\}else\{ctx\.fillText\("目前無明顯症狀",540,y\);y\+=48\}''',
                  new,
                  s
              )
              if n != 1:
                  raise SystemExit(f'Expected one Story symptom block, patched {n}')
          else:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit source fix
        run: |
          git config user.name '1884 Web App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show all six symptoms in Story output'
          git push
