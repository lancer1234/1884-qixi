name: Install EX recycling client

on:
  push:
    paths:
      - '.github/workflows/install-ex-recycling.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject cloud submission scripts into index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<script src="./ex-recycling-config.js"></script>'
          block = '''\n<script src="./ex-recycling-config.js"></script>\n<script src="./ex-recycling-client.js"></script>\n'''

          if marker in html:
              print('EX recycling client already installed; nothing to change.')
          else:
              if '</body>' not in html:
                  raise SystemExit('Could not find </body> in index.html')
              html = html.replace('</body>', block + '</body>', 1)
              path.write_text(html, encoding='utf-8')
              print('Injected EX recycling cloud client.')
          PY

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect EX recycling bin to cloud backend"
          git push
