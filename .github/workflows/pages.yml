name: Deploy 1884 七夕 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'google-apps-script/'

          test -f _site/index.html
          test -f _site/ex-recycling-config.js
          test -f _site/ex-recycling-client.js

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('_site/index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not blocks:
              raise SystemExit('No inline script block found')

          for i, block in enumerate(blocks):
              Path(f'/tmp/inline-{i}.js').write_text(block, encoding='utf-8')
          print(f'Found {len(blocks)} inline script block(s)')
          PY

          for f in /tmp/inline-*.js; do
            node --check "$f"
          done

          node --check _site/ex-recycling-config.js
          node --check _site/ex-recycling-client.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
