name: Deploy 1884 七夕 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site and validate JavaScript
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          python - <<'PY'
          from pathlib import Path
          import re

          LOGO_DATA = "data:image/png;base64,"

          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('https://1884.com.tw/1884-logo-transparent.png', LOGO_DATA)
          s = s.replace('./1884-logo-story.svg', LOGO_DATA)
          s = s.replace('./1884-logo-story.png', LOGO_DATA)
          s = re.sub(r'const storyLogoData="[^"]*";', 'const storyLogoData="' + LOGO_DATA + '";', s)

          # Keep the known Safari parse fix in case an older source version is checked out.
          s = s.replace('ctx.fillText("七夕限定",540,1803)}}}', 'ctx.fillText("七夕限定",540,1803)}}')

          touch_fix = '''
          <style id="touch-fix">
            body::before,
            .hero::after,
            .card::before,
            .card::after { pointer-events:none !important; }
            .menu, .menu button,
            .options, .option,
            .option input,
            .actions, .actions button,
            textarea { position:relative; z-index:5; pointer-events:auto !important; }
            .option { touch-action:manipulation; -webkit-tap-highlight-color:rgba(214,183,126,.12); }
            button { touch-action:manipulation; }
          </style>
          '''
          if 'id="touch-fix"' not in s:
              s = s.replace('</head>', touch_fix + '\n</head>')
          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('_site/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
