name: Refine 1884 Story Card

on:
  push:
    paths:
      - '.github/workflows/refine-story.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix Story symptom rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old="if(sis.length){sis.slice(0,3).forEach(s=>{ctx.fillStyle='#d5b36f';ctx.fillText('✓',sx+44,iy);ctx.fillStyle='#eee8e1';ctx.fillText(s[0],sx+82,iy);iy+=47})}else{ctx.fillStyle='#eee8e1';ctx.fillText('目前無明顯症狀',sx+44,iy)}"
          new="if(sis.length){const symptomFont=sis.length>=6?21:sis.length>=5?23:25;const symptomGap=sis.length>=6?38:sis.length>=5?41:47;ctx.font=symptomFont+'px sans-serif';sis.forEach(s=>{ctx.fillStyle='#d5b36f';ctx.fillText('✓',sx+44,iy);ctx.fillStyle='#eee8e1';ctx.fillText(s[0],sx+82,iy);iy+=symptomGap})}else{ctx.fillStyle='#eee8e1';ctx.fillText('目前無明顯症狀',sx+44,iy)}"
          if old not in h:
              raise SystemExit('Target symptom renderer not found; refusing unsafe edit')
          h=h.replace(old,new,1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fix
        run: |
          git config user.name '1884 Web App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show all selected symptoms on Story card'
          git push
