name: Repair index source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-index.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch official 1884 logo
        run: |
          curl -L --fail --retry 3 \
            'https://1884.com.tw/1884-logo-transparent.png' \
            -o /tmp/1884-logo.png
          test -s /tmp/1884-logo.png
          base64 -w0 /tmp/1884-logo.png > /tmp/1884-logo.b64

      - name: Embed logo into source and validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          logo64 = Path('/tmp/1884-logo.b64').read_text(encoding='utf-8').strip()
          data_url = 'data:image/png;base64,' + logo64

          # Homepage logo: replace whatever broken/external source is currently there.
          s = re.sub(
              r'(<img\s+class="brand-logo"\s+src=")[^"]+("\s+alt="1884 Taipei Logo">)',
              lambda m: m.group(1) + data_url + m.group(2),
              s,
              count=1,
          )

          # Story canvas logo: support both variable names used by earlier versions.
          s = re.sub(
              r'const\s+storyLogoData\s*=\s*"[^"]*"\s*;',
              lambda m: 'const storyLogoData="' + data_url + '";',
              s,
          )
          s = re.sub(
              r'const\s+logoData\s*=\s*"[^"]*"\s*;',
              lambda m: 'const logoData="' + data_url + '";',
              s,
          )

          # Legacy syntax repair, harmless if already fixed.
          s = s.replace(
              'ctx.fillText("七夕限定",540,1803)}}}',
              'ctx.fillText("七夕限定",540,1803)}}',
          )

          p.write_text(s, encoding='utf-8')

          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/app.js').write_text(m.group(1), encoding='utf-8')
          PY

          node --check /tmp/app.js

          # Fail loudly if the old broken SVG reference remains in the source.
          if grep -q '1884-logo-story.svg' index.html; then
            echo 'Broken SVG reference still exists in index.html'
            exit 1
          fi

      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Embed official 1884 logo directly in index source'
          git push
