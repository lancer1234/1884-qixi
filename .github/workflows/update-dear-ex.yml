name: Update Dear Ex wording
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-dear-ex.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace EX Recycling Bin copy with Dear Ex
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<button onclick="go(\'exbin\')"><span class="index">03</span><strong>前任回收站</strong><small>EX RECYCLING BIN</small></button>', '<button onclick="go(\'exbin\')"><span class="index">03</span><strong>致前任</strong><small>DEAR EX,</small></button>')
          s=s.replace('<div class="topbar"><button class="back" onclick="go(\'home\')">←</button><div><b>前任回收站</b><small>EX RECYCLING BIN</small></div></div>', '<div class="topbar"><button class="back" onclick="go(\'home\')">←</button><div><b>致前任</b><small>DEAR EX,</small></div></div>')
          s=s.replace('<h2>七夕之前，有些東西該丟了。</h2><span class="english">LEAVE IT HERE BEFORE TONIGHT ENDS.</span>', '<h2>有些話不用傳給他，留在 1884 就好。</h2><span class="english">SOME WORDS ARE BETTER LEFT HERE.</span>')
          s=s.replace('<p>匿名寫下妳遇過最大的感情警訊、最想對前任說的一句話，或一段荒謬到值得留下的故事。</p>', '<p>匿名留下一句最想對前任說的話。可以是一直沒說出口的話、現在回頭最想告訴他的事，或一句不會真的傳出去的訊息。</p>')
          s=s.replace('placeholder="匿名寫在這裡，不需要留下名字。"', 'placeholder="最後想跟前任說什麼？匿名留在這裡就好。"')
          s=s.replace('>丟掉它 →<span class="english" style="color:#eadbd5">THROW IT AWAY</span>', '>留在這裡<span class="english" style="color:#eadbd5">LEAVE IT HERE</span>')
          s=s.replace('<div class="note">現場同時保留實體「前任回收站」。網頁與實體雙軌並行，避免網路或設備異常影響活動。</div>', '<div class="note">現場可同步保留簡單的實體投稿箱、紙條與筆，讓客人自由選擇參與方式。</div>')
          s=s.replace('<div id="exSuccess" class="card result" style="display:none"><div class="eyebrow">回收完成 · SUCCESSFULLY RECYCLED</div><div class="diagnosis">丟掉了，就別再撿回來。</div><div class="diagnosis-en">DON\'T PICK IT UP AGAIN.</div></div>', '<div id="exSuccess" class="card result" style="display:none"><div class="eyebrow">已留在這裡 · MESSAGE LEFT</div><div class="diagnosis">有些話，說完就夠了。</div><div class="diagnosis-en">SOME WORDS ARE ENOUGH ONCE SAID.</div></div>')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update ex feature to Dear Ex"
          git push
