name: Update Home CTA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-home-cta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage menu copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # LOVE CHECK-UP: make the IG Story output explicit before tapping.
          s, n1 = re.subn(
              r'<button\s+onclick="go\(\'checkup\'\)"[^>]*>\s*<span class="index">01</span>\s*<strong>.*?</strong>\s*<small>.*?</small>\s*</button>',
              '<button onclick="go(\'checkup\')"><span class="index">01</span><strong>感情診斷</strong><small>完成後生成 IG 限動分享圖<br>LOVE CHECK-UP · STORY SHARE</small></button>',
              s,
              count=1,
              flags=re.S,
          )

          # RED FLAG: support either the old internal screen or the newer direct card-game link.
          pattern = r'<button\s+onclick="[^"]*(?:redflag|pixel-cards\.html)[^"]*"[^>]*>\s*<span class="index">04</span>\s*<strong>.*?</strong>\s*<small>.*?</small>\s*</button>'
          replacement = '<button onclick="location.href=\'pixel-cards.html\'"><span class="index">04</span><strong>感情警訊小遊戲</strong><small>左右滑卡牌，看看妳會怎麼選<br>RED FLAG CARD GAME</small></button>'
          s, n2 = re.subn(pattern, replacement, s, count=1, flags=re.S)

          if n1 != 1:
              raise SystemExit(f'LOVE CHECK-UP homepage button not patched: {n1}')
          if n2 != 1:
              raise SystemExit(f'RED FLAG homepage button not patched: {n2}')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Clarify Story share and Red Flag card game on homepage"
          git push
