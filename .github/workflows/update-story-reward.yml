name: Update Story Reward
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-story-reward.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Qixi Web App reward copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          # Remove the Secret Mission whose only action is posting/tagging 1884.
          s = re.sub(r'\["發一則今晚的限時動態並標記 1884。","Post tonight to your Story and tag 1884\."\],?', '', s)

          # Add/refresh reward message below LOVE CHECK-UP share button.
          reward = '''<div class="card" style="margin-top:12px;text-align:center;border-color:rgba(214,183,126,.42)">
    <div class="eyebrow">七夕限定分享禮 · STORY REWARD</div>
    <p style="margin:10px 0 2px;color:#efe8e1;font-size:15px"><b>分享這張感情診斷限動並 Tag @1884_taipei，即送薯條一份。</b></p>
    <span class="english">SHARE YOUR LOVE CHECK-UP STORY + TAG @1884_taipei · GET FREE FRIES</span>
    <div class="note">完成分享後，將限時動態畫面出示給現場工作人員即可兌換。</div>
  </div>'''
          # Remove old reward block first if workflow is re-run.
          s = re.sub(r'<div class="card" style="margin-top:12px;text-align:center;border-color:rgba\(214,183,126,.42\)">.*?</div>\s*</div>', '', s, flags=re.S)
          marker = '<div class="actions"><button class="primary" onclick="shareStory()">分享／儲存<span class="english" style="color:#eadbd5">SHARE / SAVE</span></button></div>'
          if marker in s:
              s = s.replace(marker, marker + '\n  ' + reward, 1)

          # Homepage LOVE CHECK-UP card: make Story sharing and reward obvious.
          def patch_button(m):
              block = m.group(0)
              block = re.sub(r'<small>.*?</small>', '<small>完成後生成 IG 限動分享圖<br>分享並 Tag @1884_taipei 送薯條</small>', block, count=1, flags=re.S)
              return block
          s = re.sub(r'<button[^>]*onclick="go\(\'checkup\'\)"[^>]*>.*?</button>', patch_button, s, count=1, flags=re.S)

          # Make RED FLAG entry clearly a mini game if not already clear.
          def patch_redflag(m):
              block = m.group(0)
              block = block.replace('感情警訊測驗','感情警訊小遊戲')
              block = re.sub(r'<small>.*?</small>', '<small>左右滑卡牌，看看妳會怎麼選<br>RED FLAG CARD GAME</small>', block, count=1, flags=re.S)
              return block
          s = re.sub(r'<button[^>]*(?:onclick="go\(\'redflag\'\)"|onclick="location\.href=\'pixel-cards\.html\'")[^>]*>.*?</button>', patch_redflag, s, count=1, flags=re.S)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update story reward and mission copy"
            git push
          fi