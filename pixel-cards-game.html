let deck=[],i=0,stats=[50,50,50,50],sx=0,dx=0,drag=false;const card=document.getElementById('card'),rs=document.getElementById('rs'),gs=document.getElementById('gs'),portrait=document.getElementById('portrait'),charName=document.getElementById('charName'),charRole=document.getElementById('charRole'),qEl=document.getElementById('q'),qeEl=document.getElementById('qe'),preview=document.getElementById('preview'),count=document.getElementById('count'),acc=document.getElementById('acc'),end=document.getElementById('end'),ending=document.getElementById('ending'),result=document.getElementById('result'),shuffle=document.getElementById('shuffle');
function sh(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function boot(){deck=sh([...events]).slice(0,15);i=0;stats=[50,50,50,50];meters();setTimeout(()=>{shuffle.classList.add('hidden');render()},1750)}
function render(){if(i>=deck.length)return finish();let x=deck[i],v=looks[x.v%looks.length];qEl.textContent=x.q;qeEl.textContent=x.e;charName.textContent=x.n;charRole.textContent=x.r;count.textContent=(i+1)+' / '+deck.length;preview.textContent='左右拖動卡牌做決定';card.className='card';card.style.transform='';rs.style.opacity=gs.style.opacity=0;portrait.style.setProperty('--skin',v.skin);portrait.style.setProperty('--hair',v.hair);portrait.style.setProperty('--shirt',v.shirt);portrait.style.setProperty('--sc1',v.sc1);portrait.style.setProperty('--sc2',v.sc2);portrait.style.setProperty('--moon',v.moon);portrait.style.setProperty('--hairshape',v.shape);acc.textContent=v.acc}
function meters(){stats.forEach((v,k)=>{stats[k]=Math.max(5,Math.min(95,v));document.getElementById('m'+k).style.width=stats[k]+'%'})}
function start(e){drag=true;sx=(e.touches?e.touches[0].clientX:e.clientX);dx=0;card.classList.add('drag')}
function move(e){if(!drag)return;let x=(e.touches?e.touches[0].clientX:e.clientX);dx=x-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;let p=Math.min(Math.abs(dx)/100,1);if(dx<0){rs.style.opacity=p;gs.style.opacity=0;preview.textContent=deck[i].l}else{gs.style.opacity=p;rs.style.opacity=0;preview.textContent=deck[i].g}if(e.cancelable)e.preventDefault()}
function stop(){if(!drag)return;drag=false;card.classList.remove('drag');if(Math.abs(dx)>90)choose(dx>0);else{card.style.transform='';rs.style.opacity=gs.style.opacity=0;preview.textContent='左右拖動卡牌做決定'}}
function choose(right){let x=deck[i],d=right?x.G:x.L;stats=stats.map((v,k)=>v+d[k]);meters();card.classList.add(right?'right':'left');setTimeout(()=>{i++;render()},370)}
function finish(){let [mind,heart,bestie,drink]=stats;let title=mind<30?'姐妹請看好我。':heart>75?'戀愛腦已上線。':bestie<30?'今晚妳選愛情，不選姐妹。':drink>75?'微醺決策模式。':mind>75?'理智派安全下莊。':'今晚安全下莊。';ending.textContent=title;result.innerHTML=`理智 ${mind}%　心動 ${heart}%<br>姐妹 ${bestie}%　酒量 ${drink}%<br><br>本局隨機 15 / ${events.length} 張<br><br>LOVE, LIES & RED FLAGS.`;end.classList.remove('hidden')}
function restart(){end.classList.add('hidden');shuffle.classList.remove('hidden');boot()}
card.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',stop);card.addEventListener('touchstart',start,{passive:true});card.addEventListener('touchmove',move,{passive:false});card.addEventListener('touchend',stop);document.getElementById('again').addEventListener('click',restart);boot();
