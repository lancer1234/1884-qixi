</style></head><body><main class="game"><div class="brand">1884</div><div class="sub">七夕 · LOVE, LIES & RED FLAGS.</div><div class="meters"><div class="meter"><div class="ico">◇</div><div class="mname">理智</div><div class="bar"><div class="fill" id="m0"></div></div></div><div class="meter"><div class="ico">♢</div><div class="mname">心動</div><div class="bar"><div class="fill" id="m1"></div></div></div><div class="meter"><div class="ico">♧</div><div class="mname">姐妹</div><div class="bar"><div class="fill" id="m2"></div></div></div><div class="meter"><div class="ico">♨</div><div class="mname">酒量</div><div class="bar"><div class="fill" id="m3"></div></div></div></div><div class="prompt" id="q"></div><div class="prompt-en" id="qe"></div><div class="choice-preview" id="preview">左右拖動卡牌做決定</div><div class="arena"><div class="behind b1"></div><div class="behind b2"></div><article class="card" id="card"><div class="stamp r" id="rs">RED FLAG</div><div class="stamp g" id="gs">GREEN FLAG</div><div class="portrait"><div class="scene"></div><div class="moon"></div><div class="person"><div class="body"></div><div class="neck"></div><div class="face"></div><div class="hair"></div><div class="eye e1"></div><div class="eye e2"></div></div></div><div class="label" id="name">今晚的陌生人</div><div class="role" id="role">LOVE EVENT</div><div class="decision"><span>◀ RED FLAG</span><span>GREEN FLAG ▶</span></div></article></div><div class="hints"><span>左滑 · 不行</span><span id="count">1 / 10</span><span>可以 · 右滑</span></div><div class="foot">1884 TAIPEI · HIDDEN V2 PROTOTYPE</div></main><section class="shuffle" id="shuffle"><div class="brand">1884</div><div class="sub">今晚，妳會做什麼決定？</div><div class="deck"><div class="mini"></div><div class="mini"></div><div class="mini"></div></div><div class="sub">SHUFFLING YOUR BAD DECISIONS...</div></section><section class="end hidden" id="end"><div class="brand">1884</div><div class="sub">TONIGHT'S VERDICT</div><h1 id="ending"></h1><p id="result"></p><button class let deck=[],i=0,stats=[50,50,50,50],sx=0,dx=0,drag=false;const card=document.getElementById('card'),rs=document.getElementById('rs'),gs=document.getElementById('gs');function sh(a){return a.sort(()=>Math.random()-.5)}function boot(){deck=sh([...events]).slice(0,10);i=0;stats=[50,50,50,50];meters();setTimeout(()=>{document.getElementById('shuffle').classList.add('hidden');render()},1750)}function render(){if(i>=deck.length)return finish();let x=deck[i];q.textContent=x.q;qe.textContent=x.e;name.textContent=x.n;role.textContent=x.r;count.textContent=(i+1)+' / '+deck.length;preview.textContent='左右拖動卡牌做決定';card.className='card';card.style.transform='';rs.style.opacity=gs.style.opacity=0}function meters(){stats.forEach((v,k)=>{stats[k]=Math.max(5,Math.min(95,v));document.getElementById('m'+k).style.width=stats[k]+'%'})}function start(e){drag=true;sx=(e.touches?e.touches[0].clientX:e.clientX);card.classList.add('drag')}function move(e){if(!drag)return;let x=(e.touches?e.touches[0].clientX:e.clientX);dx=x-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;let p=Math.min(Math.abs(dx)/100,1);if(dx<0){rs.style.opacity=p;gs.style.opacity=0;preview.textContent=deck[i].l}else{gs.style.opacity=p;rs.style.opacity=0;preview.textContent=deck[i].g}if(e.cancelable)e.preventDefault()}function stop(){if(!drag)return;drag=false;card.classList.remove('drag');if(Math.abs(dx)>90)choose(dx>0);else{card.style.transform='';rs.style.opacity=gs.style.opacity=0;preview.textContent='左右拖動卡牌做決定'}}function choose(right){let x=deck[i],d=right?x.G:x.L;stats=stats.map((v,k)=>v+d[k]);meters();card.classList.add(right?'right':'left');setTimeout(()=>{i++;render()},370)}function finish(){let [mind,heart,bestie,drink]=stats;let title=mind<30?'姐妹請看好我。':heart>75?'戀愛腦已上線。':bestie<30?'今晚妳選男人，不選姐妹。':drink>75?'微醺決策模式。':'今晚安全下莊。';ending.textContent=title;result.innerHTML=`理智 ${mind}%　心動 ${heart}%<br>姐妹 ${bestie}%　酒量 ${drink}%<br><br>LOVE, LIES & RED FLAGS.`;end.classList.remove('hidden')}function rest
