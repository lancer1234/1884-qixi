<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090707"><title>1884｜RED FLAG LAB</title><style>:root{--bg:#090707;--gold:#c9a65f;--cream:#eee3cf;--red:#c64b58;--green:#79a780}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 25%,#3b1c20,#090707 58%);color:var(--cream);font-family:ui-monospace,monospace;min-height:100dvh}.wrap{width:min(100%,430px);min-height:100dvh;margin:auto;padding:22px 18px;display:flex;flex-direction:column}.brand{text-align:center;font:26px Georgia,serif;letter-spacing:.18em}.sub{text-align:center;color:var(--gold);font-size:9px;letter-spacing:.16em;margin:5px 0 22px}.tag{font-size:9px;color:#9b8768;text-align:center}.scene{margin:auto 0}.card{border:1px solid #80683c;background:#211315;padding:24px 20px;min-height:390px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 20px 60px #0008}.role{text-align:center;color:var(--gold);font-size:10px;letter-spacing:.12em}.who{text-align:center;font:24px Georgia,"Noto Serif TC",serif;margin:12px 0 28px}.quote{font:23px/1.6 Georgia,"Noto Serif TC",serif;text-align:center}.en{text-align:center;color:#8f8273;font-size:9px;line-height:1.5;margin-top:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.choices button,.again{min-height:58px;border:1px solid #80683c;background:#130d0e;color:var(--cream);font:inherit;padding:9px}.choices button:first-child{color:#e1838d}.choices button:last-child{color:#a6c9aa}.count{text-align:center;color:#7f725f;font-size:9px;margin-top:14px}.result{text-align:center}.result h1{font:32px Georgia,serif;color:var(--gold)}.result p{line-height:1.8;color:#b9ab96}.again{margin-top:20px;padding:12px 20px}.hidden{display:none}.foot{text-align:center;color:#665b4c;font-size:8px;margin-top:auto;padding-top:18px}</style></head><body><main class="wrap"><div class="brand">1884</div><div class="sub">RED FLAG LAB · HIDDEN EXPERIMENT</div><section id="play" class="scene"><div class="tag">獨立實驗版｜不連結主頁</div><article class="card"><div class="role" id="role"></div><div class="who" id="who"></div><div class="quote" id="q"></div><div class="en" id="en"></div><div class="choices"><button id="red">🚩 RED FLAG<br><small id="rl"></small></button><button id="green">GREEN FLAG 💚<br><small id="gl"></small></button></div><div class="count" id="count"></div></article></section><section id="end" class="scene result hidden"><div class="tag">TONIGHT'S VERDICT</div><h1 id="verdict"></h1><p id="desc"></p><button class="again" id="again">重新洗牌 / PLAY AGAIN</button></section><div class="foot">1884 TAIPEI · PRIVATE GAME PROTOTYPE</div></main><script>const cards=[['曖昧對象','正在曖昧的他','他說：「我不喜歡定義關係，但我也不希望妳跟別人約會。」','No labels, but he does not want you seeing anyone else.','這不叫曖昧，叫管很多','再給他一點時間'],['前任','妳的前任','凌晨兩點，他傳：「最近還好嗎？」','2AM. Your ex asks how you have been.','不要回','只是回個貼圖'],['第一次約會','第一次見面的他','他坐下十分鐘就開始問：「所以妳上一任為什麼分手？」','Ten minutes into the first date, he asks about your ex.','太快了吧','也許只是想了解'],['交往中','交往中的他','他說：「妳不開心可以直接講，不要叫我猜。」','Tell me when you are upset. Do not make me guess.','語氣先扣分','這句其實合理'],['朋友變曖昧','認識很久的朋友','他突然說：「如果我們三十歲都單身，要不要就在一起？」','If we are both single at 30, should we date?','不要拿我當備案','先記著也不虧'],['交友軟體','剛配對的他','第一句就是：「妳本人跟照片一樣嗎？」','First message: Do you look like your photos?','直接下一位','嘴笨而已'],['曖昧對象','最近常聊天的他','他每天跟妳說晚安，但週末常常整天消失。','Goodnight every day, disappears every weekend.','週末是有另一個我嗎','人家也有生活'],['約會對象','約會了幾次的他','他記得妳不吃香菜，點餐時先幫妳說了。','He remembers you hate cilantro.','基本而已','有在聽，加分'],['交往中','妳的另一半','吵架後他說：「我們先冷靜一下，明天再談，我不想亂講話傷妳。」','Let us cool down and talk tomorrow.','現在就講清楚','這是成熟溝通'],['前任','想復合的前任','他說：「我真的變了，妳再給我一次機會就知道。」','I changed. Give me one more chance.','經典台詞','看行動再說'],['第一次約會','第一次見面的他','他全程幾乎沒碰手機，離開前說：「今天很開心，下次換我找餐廳。」','He barely checks his phone and asks for a second date.','太積極了嗎','正常加分'],['曖昧對象','沒有名分的他','他吃醋時會問妳跟誰出去，但妳問他的行程，他說：「我們又沒在一起。」','He wants your plans but says you are not together.','雙標退散','先把關係講清楚'],['朋友介紹','朋友介紹的他','妳的姐妹說：「我認識他很久，他人真的很好，但感情上有點笨。」','Your bestie says he is nice but clueless in love.','笨也可能很累','姐妹背書先聊聊'],['交往中','交往中的他','他主動說：「這個月我有點緊，約會我們可以簡單一點嗎？」','Money is tight this month. Can dates be simpler?','好現實','願意講清楚很好'],['剛認識','今晚剛認識的他','聊不到十分鐘，他就說：「妳笑起來很好看。」','Ten minutes in: Your smile looks good.','太會了吧','稱讚而已可以'],['曖昧對象','正在曖昧的他','他說自己不愛傳訊息，但每次見面都會提前約時間、不放妳鴿子。','Bad texter, reliable in person.','訊息頻率不合','看行動比較重要'],['前任','妳的前任','分手半年後，他突然把以前一起拍的照片全部按讚。','Six months later, your ex likes all your old photos.','不要演算法復合','也許只是手滑'],['約會對象','正在約會的他','他說：「我現在也有跟別人約會，但如果我們確定要認真，我會停。」','I am dating others until we decide to be exclusive.','謝謝不用聯絡','至少很誠實'],['交往中','妳的另一半','他跟前任還有共同朋友圈，聚會前會先告訴妳前任也會到。','He tells you his ex will be at the group hangout.','前任出現就不行','有先說可以'],['朋友變曖昧','認識多年的朋友','喝完酒後他問：「如果我現在追妳，會不會太晚？」','If I pursued you now, would it be too late?','喝醉不算','明天清醒再問一次']];let deck=[],i=0,red=0,green=0;const $=x=>document.getElementById(x);function boot(){deck=[...cards].sort(()=>Math.random()-.5).slice(0,15);i=red=green=0;$('play').classList.remove('hidden');$('end').classList.add('hidden');show()}function show(){let c=deck[i];$('role').textContent=c[0];$('who').textContent=c[1];$('q').textContent='「'+c[2]+'」';$('en').textContent=c[3];$('rl').textContent=c[4];$('gl').textContent=c[5];$('count').textContent=(i+1)+' / '+deck.length}function choose(v){v==='r'?red++:green++;i++;if(i>=deck.length)return finish();show()}function finish(){$('play').classList.add('hidden');$('end').classList.remove('hidden');let p=Math.round(red/deck.length*100);$('verdict').textContent=p+'% RED FLAG';$('desc').textContent=p>=70?'妳的雷達很敏銳。今晚至少在戀愛判斷上，姐妹可以放心。':p>=40?'妳不是沒看到警訊，只是偶爾會想：「再看看好了。」':'妳對人的容忍度很高。請記得：有些不是潛力，真的只是警訊。'}$('red').onclick=()=>choose('r');$('green').onclick=()=>choose('g');$('again').onclick=boot;boot();</script></body></html>
